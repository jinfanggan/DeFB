
train_dataloader:
  type: DataLoader
  dataset:
    type: MPEblinkV2Dataset
    ann_file: /data/data1/ganjinfang/mpeblink2_1/annotations/train.json
    img_fold: /data/data1/ganjinfang/mpeblink2_1/train_rawframes/
    stride: 16
    infer_length: 24
    clip_length: 24
    frame_interval: 2
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion
    
  total_batch_size: 2 # 4 * 4
  num_workers: 1


val_dataloader:
  type: DataLoader
  dataset:
    type: MPEblinkV2Dataset
    ann_file: /data/data1/ganjinfang/mpeblink2_1/annotations/val.json
    img_fold: /data/data1/ganjinfang/mpeblink2_1/val_rawframes/
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion