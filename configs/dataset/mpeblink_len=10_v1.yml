train_dataloader:
  type: DataLoader
  dataset:
    type: MPEblinkV2Dataset
    ann_file: /data/data1/ganjinfang/ICCV-2025/mpeblink_cvpr2023/annotations/train.json
    img_fold: /data/data1/ganjinfang/ICCV-2025/mpeblink_cvpr2023/train_rawframes/
    stride: 5
    infer_length: 11
    clip_length: 11
    frame_interval: 8
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion
    
  total_batch_size: 8 # 4 * 4
  num_workers: 4


val_dataloader:
  type: DataLoader
  dataset:
    type: MPEblinkV2Dataset
    ann_file: /data/data1/ganjinfang/ICCV-2025/mpeblink_cvpr2023/annotations/val.json
    img_fold: /data/data1/ganjinfang/ICCV-2025/mpeblink_cvpr2023/val_rawframes/
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion